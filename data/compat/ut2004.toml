notes = "Reported by the user: looked correct (first map, a few minutes of play). Character Shadows offers only None and Blob: the game's own menu shows Full only on Direct3D render devices (its script says \"No render-to-texture on anything but Direct3D\"), so any Mac build of the game is the same. glthread gave no measurable gain in the benchmark (41.5 and 55.7 fps on in two runs with different camera paths, 40.4 and 40.5 off) and made the game's client-array draws pile up about 730 MB of 1 MB upload buffers, which ran the allocator dry (5,402 failed allocations in three minutes, and the earlier crash) until the bundle bounded them; with it off the game uses 51 MB of GART at most. No frame-rate figure from another card."
