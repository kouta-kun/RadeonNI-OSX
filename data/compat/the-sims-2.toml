notes = """Runs and plays at about 13 to 14 fps in the neighborhood and in a lot; 30 fps is not reachable from the driver side (the game's own work is most of each 66 ms frame). Known problems: at a few camera angles the picture of a mirror is repeated elsewhere on the screen (seen by the player, not yet reproduced or explained); the game froze for about two seconds once (unexplained); before the upload guard (patch 0029) it crashed on loading a lot and when pausing, the game passing glDrawElements indices longer than its own array. The guard stops the copy at the fault; it has not yet faulted inside the game, so the crash is not shown to be gone. The intro movies crash in Apple's QuickTime, not in our driver. No other card to compare with."""
reporter = "kouta-kun"
